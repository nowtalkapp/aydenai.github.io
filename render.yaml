services:
  - type: web
    name: ayden-ai
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SESSION_SECRET
        sync: false
      - key: AI_API_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_PERSONALITY_PROMPT
        sync: false
      - key: AI_TEMPERATURE
        value: "0.8"
      - key: AI_MAX_TOKENS
        value: "800"
