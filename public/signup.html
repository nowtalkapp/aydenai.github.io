<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · Ayden</title><link rel="stylesheet" href="/auth.css"></head><body>
<main class="auth"><div class="auth-card"><div class="brand"><span>A</span><b>ayden</b></div><h1>Create account</h1><p>Make your Ayden account.</p><form id="signup"><div class="row"><label>First name<input id="firstName" required autocomplete="given-name"></label><label>Last name<input id="lastName" required autocomplete="family-name"></label></div><label>Email<input type="email" id="email" required autocomplete="email"></label><label>Password<input type="password" id="password" required minlength="8" autocomplete="new-password"></label><label>Birthday <small>(optional)</small><input type="date" id="birthday" autocomplete="bday"></label><button>Create account</button><div class="error" id="error"></div></form><p class="switch">already have an account? <a href="/login.html">sign in</a></p></div></main><script src="/signup.js"></script></body></html>
