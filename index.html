<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Ayden — a simple, intelligent AI assistant.">
  <title>Ayden — AI Assistant</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">A</div>
        <span>Ayden</span>
      </div>

      <button class="new-chat" id="newChat" type="button">
        <span class="plus">+</span> New chat
      </button>

      <nav class="side-nav" aria-label="Primary">
        <button class="nav-item active" type="button" data-action="home">
          <span>⌂</span> Home
        </button>
        <button class="nav-item" type="button" data-action="history">
          <span>◷</span> History
        </button>
      </nav>

      <div class="sidebar-spacer"></div>
      <div class="side-note">
        <div class="status-dot"></div>
        <div>
          <strong>Ayden is online</strong>
          <small>Private • Fast • Helpful</small>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="Open menu">☰</button>
        <div class="model-name">Ayden <span>AI</span></div>
        <button class="top-action" id="themeBtn" type="button" title="Toggle contrast">◐</button>
      </header>

      <section class="chat-shell" id="chatShell">
        <div class="welcome" id="welcome">
          <div class="hero-mark">A</div>
          <h1>What can I help with?</h1>
          <p>Ask Ayden anything. Get clear answers, explore ideas, or build something new.</p>

          <div class="suggestions">
            <button type="button" data-prompt="Explain a difficult idea in simple terms">Explain something</button>
            <button type="button" data-prompt="Give me three creative ideas for a project">Brainstorm ideas</button>
            <button type="button" data-prompt="Help me write a clean, professional website">Build something</button>
            <button type="button" data-prompt="Help me make a plan for learning a new skill">Make a plan</button>
          </div>
        </div>

        <div class="messages" id="messages" aria-live="polite"></div>
      </section>

      <form class="composer-wrap" id="composer">
        <div class="composer">
          <textarea id="prompt" rows="1" placeholder="Message Ayden..." aria-label="Message Ayden"></textarea>
          <button class="send" type="submit" aria-label="Send message">↑</button>
        </div>
        <div class="disclaimer">Ayden can make mistakes. Check important information.</div>
      </form>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
