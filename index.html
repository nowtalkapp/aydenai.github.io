<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Ayden — a simple AI chat.">
  <meta name="theme-color" content="#0b0b0b">
  <title>Ayden</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <a class="logo" href="#" aria-label="Ayden home">
          <span class="logo-mark">A</span>
          <span>ayden</span>
        </a>
        <button class="ghost close-sidebar" id="close-sidebar" aria-label="Close menu">×</button>
      </div>

      <button class="new-chat" id="new-chat"><span>＋</span> New chat <kbd>Ctrl K</kbd></button>

      <div class="history-label">Today</div>
      <button class="history-item active">New conversation</button>

      <div class="sidebar-fill"></div>

      <button class="sidebar-button" id="settings-open">⚙ <span>Settings</span></button>
      <div class="profile">
        <div class="avatar">A</div>
        <div>
          <strong>Ayden</strong>
          <small id="connection-label">not connected</small>
        </div>
      </div>
    </aside>

    <div class="overlay" id="overlay"></div>

    <main class="main">
      <header class="topbar">
        <button class="ghost menu" id="open-sidebar" aria-label="Open menu">☰</button>
        <button class="model" id="model-button">Ayden <span>⌄</span></button>
        <div class="top-actions">
          <span class="connection" id="connection-dot"><i></i><span id="connection-text">offline</span></span>
        </div>
      </header>

      <section class="chat" id="chat">
        <div class="welcome" id="welcome">
          <div class="welcome-logo">A</div>
          <h1>What can I help with?</h1>
          <p>Ask Ayden anything.</p>

          <div class="prompts">
            <button data-prompt="give me a quick idea for something fun to do today">
              <strong>Something fun</strong><span>give me an idea</span>
            </button>
            <button data-prompt="explain something complicated in simple terms">
              <strong>Explain something</strong><span>make it simple</span>
            </button>
            <button data-prompt="help me write a short, natural message">
              <strong>Write something</strong><span>keep it natural</span>
            </button>
            <button data-prompt="tell me a random interesting fact">
              <strong>Surprise me</strong><span>random fact</span>
            </button>
          </div>
        </div>

        <div class="messages" id="messages"></div>
      </section>

      <div class="composer-area">
        <form class="composer" id="composer">
          <textarea id="input" rows="1" maxlength="10000" placeholder="Message Ayden..." aria-label="Message Ayden"></textarea>
          <button class="send" id="send" type="submit" aria-label="Send">↑</button>
        </form>
        <div class="hint">Ayden can make mistakes. Check important info.</div>
      </div>
    </main>
  </div>

  <dialog class="settings" id="settings">
    <div class="settings-head">
      <div><small>AYDEN</small><h2>Settings</h2></div>
      <button class="ghost" id="settings-close">×</button>
    </div>
    <p class="note">For GitHub Pages, the AI call happens directly from your browser. Your key is saved only in this browser.</p>

    <label>API key
      <input id="api-key" type="password" autocomplete="off" placeholder="your provider key">
    </label>
    <label>API URL
      <input id="api-url" type="url" placeholder="https://api.groq.com/openai/v1/chat/completions">
    </label>
    <label>Model
      <input id="api-model" type="text" placeholder="llama-3.1-8b-instant">
    </label>

    <div class="settings-buttons">
      <button class="primary" id="save-settings">Save</button>
      <button class="secondary" id="groq-defaults">Groq defaults</button>
      <button class="secondary" id="clear-key">Clear key</button>
    </div>
    <p class="links"><a href="https://console.groq.com/keys" target="_blank" rel="noopener">Get a Groq key</a> · <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">OpenRouter keys</a></p>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
